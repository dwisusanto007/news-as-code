# CI penuh (aturan editorial, hash bukti, reviewer). Dinonaktifkan dari alur otomatis;
# jalankan manual dari tab Actions saat data siap terbit. Lihat docs/GOVERNANCE.md.
name: ci-full

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Nomor PR (isi untuk ikut menjalankan check-reviewers)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Gerbang utama: PR dengan data yang melanggar skema/aturan editorial ditolak di sini.
      - name: Validasi data terbit
        run: python -m tools.validate

      # Draf tidak harus siap terbit, tapi tetap harus konsisten (referensi, tanggal, metrik).
      - name: Validasi draf
        run: python -m tools.validate --drafts

      - name: Unit test
        run: python -m pytest -q

      # SITE_BASE_URL (Settings > Variables) mengaktifkan JSON-LD ClaimReview untuk janji nyata.
      - name: Build situs
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          if [ -n "$SITE_BASE_URL" ]; then
            python -m tools.build --base-url "$SITE_BASE_URL"
          else
            python -m tools.build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  # Ambil ulang snapshot Wayback dan cocokkan sha256. Data fiktif dilewati.
  verify-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Verifikasi hash bukti
        run: python -m tools.verify_evidence

  # Daftar reviewer di YAML harus cocok dengan approval PR yang sebenarnya.
  check-reviewers:
    if: inputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Cocokkan reviewer dengan approval PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python -m tools.check_reviewers --repo "$REPO" --pr "$PR_NUMBER"
