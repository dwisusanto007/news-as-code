name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Gerbang utama: PR dengan data yang melanggar skema/aturan editorial ditolak di sini.
      - name: Validasi data
        run: python tools/validate.py

      - name: Unit test
        run: python -m pytest -q

      - name: Build situs
        run: python tools/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
