# CI ringan untuk fase pengumpulan data: hanya memastikan bentuk file sesuai skema,
# supaya kontribusi tidak terhambat. Aturan editorial penuh ada di ci-full.yml (manual).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install check-jsonschema==0.38.2

      - name: Validasi janji (terbit dan draf)
        run: |
          find data/promises data/drafts -name '*.yaml' 2>/dev/null \
            | xargs -r check-jsonschema --schemafile schema/promise.schema.json

      - name: Validasi program
        run: |
          find data/programs -name '*.yaml' 2>/dev/null \
            | xargs -r check-jsonschema --schemafile schema/program.schema.json
