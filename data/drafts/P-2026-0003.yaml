    evidence_ids: [E2]
  - date: "2025-10-29"
    kind: update
    summary: Dalam rapat terbatas, Kepala BGN masih mengejar 82,9 juta di akhir tahun. Saat itu potensi layanan 39,5 juta penerima di 13.514 SPPG, dan ia menyebut 75 juta masih dapat dimaklumi Presiden.
