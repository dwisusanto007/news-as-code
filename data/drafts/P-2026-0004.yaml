timeline:
  - date: "2026-01-20"
    kind: statement
    summary: Kepala BGN memaparkan 59,86 juta penerima di 21.102 SPPG kepada Komisi IX DPR, dengan proyeksi 82,9 juta pada pertengahan tahun.
    evidence_ids: [E1]
  - date: "2026-04-22"
    kind: update
    summary: Kepala BGN menyebut target 82,9 juta tercapai pada tahun 2026, dengan sekitar 62 juta penerima saat itu.
    evidence_ids: [E2]
  - date: "2026-05-12"
    kind: update
    summary: Bakom melaporkan 61,99 juta penerima (74,8% dari target) di 28.390 SPPG terdaftar, 55,42% di antaranya bersertifikat SLHS.
    evidence_ids: [E3]
  - date: "2026-08-31"
    kind: update
    summary: Data Kemenkeu mencatat sekitar 57 juta penerima akhir Agustus (46,2 juta siswa, 10,8 juta non-siswa) dan realisasi anggaran Rp134,2 triliun.
    evidence_ids: [E4]
  - date: "2026-09-16"
    kind: setback
    summary: Tercatat 56,99 juta penerima (sementara), 76,45% dari target 74,56 juta. Realisasi anggaran Rp139,77 triliun dari pagu Rp218,77 triliun.
