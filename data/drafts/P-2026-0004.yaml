id: P-2026-0004
title: Target 82,9 juta penerima MBG pada 2026
official:
  name: Dadan Hindayana
  position: Kepala Badan Gizi Nasional
  institution: Badan Gizi Nasional (BGN)
  public_official: true
promise:
  statement: >-
    Setelah target akhir 2025 terlewat, BGN memproyeksikan 82,9 juta penerima
    manfaat MBG tercapai pada pertengahan 2026, lalu menyebut target itu
    tercapai pada tahun 2026.
  made_at: "2026-01-20"
  deadline: "2026-12-31"
  source_evidence_id: E1
status: in_progress
status_note: >-
  Per 16 Sep 2026 tercatat 56,99 juta penerima (sementara), 76,45% dari target
  yang kini 74,56 juta, bukan 82,9 juta. Tonggak pertengahan 2026 terlewati.
  Angka antar sumber berbeda: BGN/Bakom 61,99 juta (12 Mei), data Kemenkeu 57
  juta (akhir Agustus) dan 52,4 juta (Januari). Penyebab selisih belum
  dijelaskan sumber yang dikutip.
