promise:
  statement: >-
    Kepala BGN menyatakan target pembentukan sekitar 31.000 Satuan Pelayanan
    Pemenuhan Gizi (SPPG) pada akhir tahun 2025, terdiri dari 25.000 unit di
    daerah aglomerasi dan 6.000 unit di daerah terpencil.
